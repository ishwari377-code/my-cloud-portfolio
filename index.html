<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eshwari's Cloud Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 50px; }
        h1 { color: #2c3e50; }
        p { color: #34495e; font-size: 18px; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { background-color: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background-color: #219653; }
        .counter { font-size: 24px; font-weight: bold; color: #2c3e50; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Welcome to My Cloud Journey</h1>
        <p>Hi, I am Eshwari! This portfolio is hosted on global cloud servers.</p>
        
        <!-- Interactive Section -->
        <button class="btn" onclick="updateCounter()">Click to Track Visit</button>
        <div class="counter" id="countLabel">0</div>
        <p style="font-size:14px; color:gray;">(This tracks clicks locally on your browser session!)</p>
    </div>

    <script>
        let count = 0;
        function updateCounter() {
            count++;
            document.getElementById("countLabel").innerText = count;
        }
    </script>
</body>
</html>
